[tool.poetry]
name = "pySigma_QRadar_base"
version = "0.1.0"
description = "pySigma QRadar base submodule"
authors = ["IBM <noaakless@gmail.com>"]
license = "MIT"
repository = "https://github.com/IBM/pySigma_QRadar_base"
packages = [
    { include = "sigma" }
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pysigma = ">=1.5.1, <3.0.0"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
pytest-cov = ">=4.0.0"
coverage = ">=7.2.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"